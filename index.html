<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Battle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #0a0a1a; display: flex; justify-content: center; padding: 0; font-family: -apple-system, sans-serif; min-height: 100vh; touch-action: pan-x pan-y; overflow: hidden; }
        #app { max-width: 500px; width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 70px 12px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-shrink: 0; }
        h1 { color: #e94560; font-size: 22px; }
        .support { background: linear-gradient(135deg, #e94560, #c23152); color: white; border: none; padding: 8px; border-radius: 30px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 8px; flex-shrink: 0; }
        .canvas-wrap { width: 100%; aspect-ratio: 1/1; background: #2a2a3a; border-radius: 16px; overflow: hidden; border: 3px solid #e94560; position: relative; touch-action: pan-x pan-y; flex-shrink: 0; }
        #canvas { width: 100%; height: 100%; image-rendering: pixelated; cursor: crosshair; display: block; touch-action: pan-x pan-y; background: #ffffff; }
        .zoom-label { position: absolute; bottom: 8px; right: 12px; background: rgba(0,0,0,0.7); color: #fff; padding: 2px 10px; border-radius: 12px; font-size: 11px; pointer-events: none; border: 1px solid #e94560; }
        .controls { display: flex; gap: 6px; justify-content: center; margin: 6px 0; flex-shrink: 0; flex-wrap: wrap; }
        .controls button { background: rgba(255,255,255,0.06); border: 1px solid #2a2a4a; color: #ccc; padding: 4px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; }
        .controls button.active { background: rgba(233,69,96,0.2); border-color: #e94560; color: #e94560; }
        .palette { display: flex; gap: 5px; justify-content: center; margin: 4px 0; flex-shrink: 0; flex-wrap: wrap; }
        .color-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; }
        .color-btn.selected { border-color: white; box-shadow: 0 0 16px rgba(233,69,96,0.5); transform: scale(1.1); }
        .color-btn.empty { background: repeating-conic-gradient(#ccc 0% 25%, white 0% 50%) 50% / 8px 8px; border-color: #555; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10,10,26,0.95); backdrop-filter: blur(12px); display: flex; justify-content: space-around; padding: 8px 0 12px 0; border-top: 1px solid #2a2a4a; z-index: 10; }
        .bottom-nav button { background: transparent; border: none; color: #666; font-size: 13px; font-weight: 500; padding: 4px 20px; border-radius: 20px; cursor: pointer; }
        .bottom-nav button.active { color: #e94560; background: rgba(233,69,96,0.1); }
        .profile-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a1a; z-index: 20; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
        .profile-page.show { display: flex; }
        .profile-page .info { display: flex; align-items: center; gap: 14px; margin: 10px 0 16px 0; }
        .profile-page .avatar { width: 56px; height: 56px; border-radius: 50%; background: #2a2a4a; display: flex; align-items: center; justify-content: center; font-size: 28px; border: 2px solid #e94560; overflow: hidden; flex-shrink: 0; }
        .profile-page .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-page .name { font-size: 18px; font-weight: 600; }
        .profile-page .id { font-size: 13px; color: #888; }
        .profile-page .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; background: rgba(0,0,0,0.3); padding: 14px; border-radius: 12px; margin-bottom: 16px; }
        .profile-page .stats .stat { display: flex; justify-content: space-between; font-size: 14px; }
        .profile-page .stats .stat span:first-child { color: #888; }
        .profile-page .stats .stat span:last-child { color: #eee; font-weight: 500; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(10,10,26,0.95); color: white; padding: 10px 20px; border-radius: 30px; border: 1px solid #e94560; font-size: 14px; opacity: 0; transition: 0.3s; z-index: 99; backdrop-filter: blur(8px); white-space: nowrap; pointer-events: none; }
        .toast.show { opacity: 1; }
        .profile-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10,10,26,0.95); backdrop-filter: blur(12px); display: none; justify-content: space-around; padding: 8px 0 12px 0; border-top: 1px solid #2a2a4a; z-index: 25; }
        .profile-nav button { background: transparent; border: none; color: #666; font-size: 13px; font-weight: 500; padding: 4px 20px; border-radius: 20px; cursor: pointer; }
        .profile-nav button.active { color: #e94560; background: rgba(233,69,96,0.1); }
        @media (max-width: 400px) { .color-btn { width: 26px; height: 26px; } }
    </style>
</head>
<body>
<div id="app">
    <div class="header">
        <h1>⚔️ Pixel Battle</h1>
    </div>
    <button class="support" id="supportBtn">❤️ Поддержите нас подпиской</button>
    <div class="canvas-wrap" id="canvasWrap">
        <canvas id="canvas" width="1000" height="1000"></canvas>
        <div class="zoom-label" id="zoomLabel">100%</div>
    </div>
    <div class="controls">
        <button id="gridBtn">📐 Сетка</button>
    </div>
    <div class="palette" id="palette"></div>
    <div id="toast" class="toast">👋 Кликни на холст!</div>
</div>
<div class="profile-page" id="profilePage">
    <div class="info">
        <div class="avatar" id="profileAvatar">👤</div>
        <div>
            <div class="name" id="profileName">Игрок</div>
            <div class="id" id="profileId">ID: ---</div>
        </div>
    </div>
    <div class="stats">
        <div class="stat"><span>Первый</span><span id="pFirst">—</span></div>
        <div class="stat"><span>Последний</span><span id="pLast">—</span></div>
        <div class="stat"><span>Всего</span><span id="pTotal">0</span></div>
        <div class="stat"><span>Статус</span><span id="pStatus">✅</span></div>
    </div>
</div>

<div class="profile-nav" id="profileNav">
    <button id="profileBattleBtn">⚔️ Битва</button>
    <button class="active" id="profileProfileBtn">👤 Profile</button>
</div>

<div class="bottom-nav" id="mainNav">
    <button class="active" id="tabBattle">⚔️ Битва</button>
    <button id="tabProfile">👤 Profile</button>
</div>
<script>
(function() {
    const SIZE = 1000;
    const COLORS = [
        { name: 'Без цвета', value: null },
        { name: 'Белый', value: '#FFFFFF' },
        { name: 'Черный', value: '#000000' },
        { name: 'Красный', value: '#FF0000' },
        { name: 'Оранжевый', value: '#FFA500' },
        { name: 'Желтый', value: '#FFFF00' },
        { name: 'Зеленый', value: '#00FF00' },
        { name: 'Голубой', value: '#00FFFF' },
        { name: 'Синий', value: '#0000FF' },
        { name: 'Розовый', value: '#FF00FF' },
        { name: 'Коричневый', value: '#A52A2A' }
    ];

    let pixels = new Array(SIZE * SIZE).fill(null);
    let selectedColor = null;
    let zoom = 1;
    let showGrid = false;
    let currentUser = null;
    let canPlace = false;
    let cooldown = 10000;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const palette = document.getElementById('palette');
    const toast = document.getElementById('toast');
    const zoomLabel = document.getElementById('zoomLabel');
    const profilePage = document.getElementById('profilePage');
    const profileNav = document.getElementById('profileNav');
    const mainNav = document.getElementById('mainNav');

    function zoomIn() {
        zoom = Math.max(0.01, zoom / 1.3);
        render();
    }

    function zoomOut() {
        zoom = Math.min(2, zoom * 1.3);
        render();
    }

    // ===== ПОЛУЧЕНИЕ ДАННЫХ ПОЛЬЗОВАТЕЛЯ (ТОЛЬКО ID И ПОЛНОЕ ИМЯ, БЕЗ USERNAME) =====
    function initUser() {
        // Способ 1: Telegram WebApp
        if (window.Telegram && Telegram.WebApp) {
            try {
                Telegram.WebApp.ready();
                const userData = Telegram.WebApp.initDataUnsafe?.user;
                if (userData && userData.id) {
                    currentUser = {
                        id: userData.id,
                        name: [userData.first_name, userData.last_name].filter(Boolean).join(' ').trim() || 'Игрок',
                        photo: userData.photo_url || ''
                    };
                    updateProfile();
                    return;
                }
            } catch(e) {
                console.warn('Telegram WebApp error:', e);
            }
        }

        // Способ 2: Прямой доступ к глобальному объекту
        try {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
                const u = window.Telegram.WebApp.initDataUnsafe.user;
                if (u && u.id) {
                    currentUser = {
                        id: u.id,
                        name: [u.first_name, u.last_name].filter(Boolean).join(' ').trim() || 'Игрок',
                        photo: u.photo_url || ''
                    };
                    updateProfile();
                    return;
                }
            }
        } catch(e) {
            console.warn('Fallback error:', e);
        }

        // Способ 3: Парсинг из query string
        try {
            const params = new URLSearchParams(window.location.search);
            const userParam = params.get('tgWebAppData');
            if (userParam) {
                const decoded = decodeURIComponent(userParam);
                const match = decoded.match(/user=([^&]+)/);
                if (match) {
                    const userObj = JSON.parse(decodeURIComponent(match[1]));
                    if (userObj && userObj.id) {
                        currentUser = {
                            id: userObj.id,
                            name: [userObj.first_name, userObj.last_name].filter(Boolean).join(' ').trim() || 'Игрок',
                            photo: userObj.photo_url || ''
                        };
                        updateProfile();
                        return;
                    }
                }
            }
        } catch(e) {
            console.warn('URL parsing error:', e);
        }

        // Если ничего не сработало - показываем ошибку
        showToast('❌ Ошибка: не удалось получить данные пользователя Telegram');
        console.error('Не удалось получить данные пользователя. Запустите приложение через Telegram.');
    }

    function updateProfile() {
        if (!currentUser) return;
        
        document.getElementById('profileName').textContent = currentUser.name;
        document.getElementById('profileId').textContent = 'ID: ' + currentUser.id;
        
        if (currentUser.photo) {
            document.getElementById('profileAvatar').innerHTML = '<img src="'+currentUser.photo+'">';
        } else {
            document.getElementById('profileAvatar').textContent = '👤';
        }
        
        let stats = getStats(currentUser.id);
        document.getElementById('pFirst').textContent = stats.first ? new Date(stats.first).toLocaleDateString() : '—';
        document.getElementById('pLast').textContent = stats.last ? new Date(stats.last).toLocaleDateString() : '—';
        document.getElementById('pTotal').textContent = stats.total || 0;
        
        document.getElementById('pStatus').textContent = '✅ Активен';
        document.getElementById('pStatus').style.color = '#4caf50';
    }

    function getStats(id) {
        let data = JSON.parse(localStorage.getItem('pixelStats') || '{}');
        if (!data[id]) data[id] = { first: null, last: null, total: 0 };
        return data[id];
    }

    function saveStats(id, stats) {
        let data = JSON.parse(localStorage.getItem('pixelStats') || '{}');
        data[id] = stats;
        localStorage.setItem('pixelStats', JSON.stringify(data));
    }

    function loadPixels() {
        try {
            let data = JSON.parse(localStorage.getItem('pixels') || '[]');
            for (let i = 0; i < data.length && i < pixels.length; i++) {
                if (data[i]) pixels[i] = data[i];
            }
        } catch(e) {}
    }

    function savePixels() {
        localStorage.setItem('pixels', JSON.stringify(pixels));
    }

    function render() {
        let rect = canvas.getBoundingClientRect();
        let displaySize = Math.min(rect.width, rect.height);
        canvas.style.width = displaySize + 'px';
        canvas.style.height = displaySize + 'px';
        canvas.width = SIZE;
        canvas.height = SIZE;

        ctx.clearRect(0, 0, SIZE, SIZE);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, SIZE, SIZE);

        let pixelSize = Math.max(1, Math.floor(1 / zoom));
        let startX = Math.floor((1 - 1/zoom) / 2 * SIZE);
        let startY = Math.floor((1 - 1/zoom) / 2 * SIZE);
        let endX = Math.floor((1 + 1/zoom) / 2 * SIZE);
        let endY = Math.floor((1 + 1/zoom) / 2 * SIZE);

        for (let y = startY; y < endY && y < SIZE; y += pixelSize) {
            for (let x = startX; x < endX && x < SIZE; x += pixelSize) {
                let idx = y * SIZE + x;
                if (pixels[idx]) {
                    ctx.fillStyle = pixels[idx].color;
                    ctx.fillRect(x, y, pixelSize, pixelSize);
                }
            }
        }

        if (showGrid) {
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = 0.5;
            for (let y = startY; y <= endY && y < SIZE; y += pixelSize) {
                ctx.beginPath();
                ctx.moveTo(startX, y);
                ctx.lineTo(endX, y);
                ctx.stroke();
            }
            for (let x = startX; x <= endX && x < SIZE; x += pixelSize) {
                ctx.beginPath();
                ctx.moveTo(x, startY);
                ctx.lineTo(x, endY);
                ctx.stroke();
            }
        }

        let displayZoom = Math.round((1 / zoom) * 100);
        zoomLabel.textContent = displayZoom + '%';
        
        canPlace = zoom <= 0.02;
    }

    function getCoords(clientX, clientY) {
        let rect = canvas.getBoundingClientRect();
        
        let normX = (clientX - rect.left) / rect.width;
        let normY = (clientY - rect.top) / rect.height;
        
        normX = Math.max(0, Math.min(1, normX));
        normY = Math.max(0, Math.min(1, normY));
        
        let viewSize = 1 / zoom;
        let offsetX = (1 - viewSize) / 2;
        let offsetY = (1 - viewSize) / 2;
        
        let x = Math.round((offsetX + normX * viewSize) * SIZE);
        let y = Math.round((offsetY + normY * viewSize) * SIZE);
        
        x = Math.max(0, Math.min(SIZE - 1, x));
        y = Math.max(0, Math.min(SIZE - 1, y));
        
        return { x, y };
    }

    let toastTimer;

    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    let lastClick = 0;

    function handleClick(clientX, clientY) {
        if (!currentUser || !currentUser.id) { 
            showToast('❌ Ошибка: пользователь не определён'); 
            return; 
        }

        if (!canPlace && selectedColor !== null) {
            showToast('🔍 Приблизьтесь (5000%+) чтобы ставить');
            return;
        }

        let { x, y } = getCoords(clientX, clientY);
        if (x < 0 || x >= SIZE || y < 0 || y >= SIZE) { showToast('❌ Вне холста'); return; }

        let idx = y * SIZE + x;

        if (selectedColor === null) {
            if (pixels[idx]) {
                let time = Math.floor((Date.now() - pixels[idx].time) / (1000*60*60*24));
                let days = time > 0 ? time + ' дн.' : 'сегодня';
                showToast('🎨 ' + (pixels[idx].name || 'anon') + ' (ID:' + pixels[idx].id + ') ' + days + ' (' + x + ',' + y + ')');
            } else {
                showToast('⬜ Пусто (' + x + ',' + y + ')');
            }
            return;
        }

        let now = Date.now();
        if (now - lastClick < cooldown) {
            showToast('⏳ Подожди ' + Math.ceil((cooldown - (now - lastClick))/1000) + 'с');
            return;
        }

        if (pixels[idx]) {
            showToast('❌ Занято (' + (pixels[idx].name || 'anon') + ')');
            return;
        }

        pixels[idx] = { 
            color: selectedColor, 
            id: currentUser.id, 
            name: currentUser.name,
            time: Date.now() 
        };
        lastClick = now;
        render();

        let stats = getStats(currentUser.id);
        if (!stats.first) stats.first = Date.now();
        stats.last = Date.now();
        stats.total = (stats.total || 0) + 1;
        saveStats(currentUser.id, stats);

        showToast('✅ Пиксель! (' + x + ',' + y + ')');
        updateProfile();
        savePixels();
    }

    function renderPalette() {
        palette.innerHTML = '';
        COLORS.forEach(c => {
            let btn = document.createElement('div');
            btn.className = 'color-btn';
            if (c.value === null) {
                btn.classList.add('empty');
            } else {
                btn.style.background = c.value;
            }
            if (selectedColor === c.value) btn.classList.add('selected');
            btn.title = c.name;
            btn.addEventListener('click', () => {
                selectedColor = c.value;
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                showToast('🎨 ' + c.name);
            });
            palette.appendChild(btn);
        });
    }

    function setup() {
        let lastTouchDist = 0;

        // Зум на мобилке (мультитач)
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                let dx = e.touches[0].clientX - e.touches[1].clientX;
                let dy = e.touches[0].clientY - e.touches[1].clientY;
                lastTouchDist = Math.sqrt(dx*dx + dy*dy);
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                let dx = e.touches[0].clientX - e.touches[1].clientX;
                let dy = e.touches[0].clientY - e.touches[1].clientY;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (lastTouchDist > 0) {
                    let delta = dist / lastTouchDist;
                    let speedFactor = 2.5;
                    let adjustedDelta = 1 + (delta - 1) * speedFactor;
                    zoom = Math.max(0.01, Math.min(2, zoom / adjustedDelta));
                    render();
                }
                lastTouchDist = dist;
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            lastTouchDist = 0;
        }, { passive: true });

        // Зум на ПК
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0) {
                zoomIn();
            } else {
                zoomOut();
            }
        }, { passive: false });

        // Клик
        canvas.addEventListener('click', (e) => handleClick(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                let touch = e.touches[0];
                handleClick(touch.clientX, touch.clientY);
            }
        }, { passive: true });

        // Сетка
        let gridBtn = document.getElementById('gridBtn');
        gridBtn.addEventListener('click', () => {
            showGrid = !showGrid;
            gridBtn.classList.toggle('active');
            render();
        });

        // Поддержка
        document.getElementById('supportBtn').addEventListener('click', () => {
            window.open('https://t.me/empty0_0channel/3', '_blank');
        });

        // Профиль
        function openProfile() {
            document.getElementById('tabProfile').classList.add('active');
            document.getElementById('tabBattle').classList.remove('active');
            profilePage.classList.add('show');
            profileNav.style.display = 'flex';
            mainNav.style.display = 'none';
            updateProfile();
        }

        function closeProfile() {
            profilePage.classList.remove('show');
            profileNav.style.display = 'none';
            mainNav.style.display = 'flex';
            document.getElementById('tabBattle').classList.add('active');
            document.getElementById('tabProfile').classList.remove('active');
        }

        document.getElementById('tabProfile').addEventListener('click', openProfile);
        document.getElementById('tabBattle').addEventListener('click', closeProfile);
        document.getElementById('profileBattleBtn').addEventListener('click', closeProfile);
        document.getElementById('profileProfileBtn').addEventListener('click', () => {
            document.getElementById('profileBattleBtn').classList.remove('active');
            document.getElementById('profileProfileBtn').classList.add('active');
            updateProfile();
        });

        loadPixels();
        initUser();
        renderPalette();
        render();

        setInterval(savePixels, 5000);
    }

    document.addEventListener('DOMContentLoaded', setup);
})();
</script>
</body>
    </html>
