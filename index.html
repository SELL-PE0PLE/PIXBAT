<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Battle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #0a0a1a; display: flex; justify-content: center; padding: 12px 12px 80px 12px; font-family: -apple-system, sans-serif; min-height: 100vh; }
        #app { max-width: 500px; width: 100%; }
        h1 { color: #e94560; text-align: center; font-size: 24px; margin-bottom: 10px; }
        .support { background: linear-gradient(135deg, #e94560, #c23152); color: white; border: none; padding: 10px; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .canvas-wrap { width: 100%; aspect-ratio: 1/1; background: white; border-radius: 16px; overflow: hidden; border: 2px solid #2a2a4a; position: relative; }
        #canvas { width: 100%; height: 100%; image-rendering: pixelated; cursor: crosshair; display: block; }
        .zoom-label { position: absolute; bottom: 8px; right: 12px; background: rgba(0,0,0,0.6); color: #ccc; padding: 2px 12px; border-radius: 12px; font-size: 12px; }
        .controls { display: flex; gap: 6px; justify-content: center; margin: 8px 0; flex-wrap: wrap; }
        .controls button { background: rgba(255,255,255,0.06); border: 1px solid #2a2a4a; color: #ccc; padding: 5px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; }
        .controls button.active { background: rgba(233,69,96,0.2); border-color: #e94560; color: #e94560; }
        .palette { display: flex; gap: 6px; justify-content: center; margin: 8px 0; flex-wrap: wrap; }
        .color-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
        .color-btn.selected { border-color: white; box-shadow: 0 0 16px rgba(233,69,96,0.5); transform: scale(1.1); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10,10,26,0.95); backdrop-filter: blur(12px); display: flex; justify-content: space-around; padding: 10px 0 14px 0; border-top: 1px solid #2a2a4a; }
        .bottom-nav button { background: transparent; border: none; color: #666; font-size: 13px; font-weight: 500; padding: 4px 20px; border-radius: 20px; cursor: pointer; }
        .bottom-nav button.active { color: #e94560; background: rgba(233,69,96,0.1); }
        .profile-panel { background: rgba(255,255,255,0.04); border-radius: 16px; padding: 16px; border: 1px solid #2a2a4a; display: none; margin-top: 10px; }
        .profile-panel.show { display: block; }
        .profile-panel .info { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .profile-panel .avatar { width: 48px; height: 48px; border-radius: 50%; background: #2a2a4a; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 2px solid #e94560; overflow: hidden; }
        .profile-panel .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-panel .name { font-size: 16px; font-weight: 600; }
        .profile-panel .id { font-size: 12px; color: #888; }
        .profile-panel .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px; margin-bottom: 12px; }
        .profile-panel .stats .stat { display: flex; justify-content: space-between; font-size: 13px; }
        .profile-panel .stats .stat span:first-child { color: #888; }
        .profile-panel .stats .stat span:last-child { color: #eee; font-weight: 500; }
        .toggle-wrap { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
        .toggle-wrap label { font-size: 13px; color: #aaa; }
        .toggle { width: 44px; height: 26px; background: #2a2a4a; border-radius: 13px; cursor: pointer; position: relative; transition: 0.3s; flex-shrink: 0; }
        .toggle.active { background: #e94560; }
        .toggle .thumb { position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; background: white; border-radius: 50%; transition: 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .toggle.active .thumb { left: 20px; }
        .block-row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
        .block-row input { flex: 1; min-width: 80px; background: rgba(255,255,255,0.06); border: 1px solid #2a2a4a; color: white; padding: 6px 12px; border-radius: 20px; font-size: 14px; outline: none; }
        .block-row input:focus { border-color: #e94560; }
        .block-row button { background: rgba(233,69,96,0.15); border: 1px solid #e94560; color: #e94560; padding: 6px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; }
        .block-row button.green { background: rgba(76,175,80,0.15); border-color: #4caf50; color: #4caf50; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(10,10,26,0.95); color: white; padding: 10px 20px; border-radius: 30px; border: 1px solid #e94560; font-size: 14px; opacity: 0; transition: 0.3s; z-index: 99; backdrop-filter: blur(8px); white-space: nowrap; pointer-events: none; }
        .toast.show { opacity: 1; }
        @media (max-width: 400px) { .color-btn { width: 28px; height: 28px; } .controls button { font-size: 11px; padding: 4px 10px; } }
    </style>
</head>
<body>
<div id="app">
        <h1>⚔️ Pixel Battle</h1>

    <button class="support" id="supportBtn">❤️ Поддержите нас подпиской</button>

    <div class="canvas-wrap" id="canvasWrap">
        <canvas id="canvas" width="1000" height="1000"></canvas>
        <div class="zoom-label" id="zoomLabel">100%</div>
    </div>

    <div class="controls">
        <button id="gridBtn">📐 Сетка</button>
        <button id="zoomIn">➕</button>
        <button id="zoomOut">➖</button>
        <button id="resetBtn">⟲ Сброс</button>
        <button id="magnifierBtn">🔍 Лупа</button>
    </div>

    <div class="palette" id="palette"></div>

    <div class="bottom-nav">
        <button class="active" id="tabBattle">⚔️ Битва</button>
        <button id="tabProfile">👤 Profile</button>
    </div>

    <div class="profile-panel" id="profilePanel">
        <div class="info">
            <div class="avatar" id="avatar">👤</div>
            <div>
                <div class="name" id="userName">Игрок</div>
                <div class="id" id="userId">ID: ---</div>
            </div>
        </div>
        <div class="stats">
            <div class="stat"><span>Первый</span><span id="firstPixel">—</span></div>
            <div class="stat"><span>Последний</span><span id="lastPixel">—</span></div>
            <div class="stat"><span>Всего</span><span id="totalPixels">0</span></div>
            <div class="stat"><span>Статус</span><span id="userStatus">✅</span></div>
        </div>
        <div class="toggle-wrap">
            <label>Режим Администратора</label>
            <div class="toggle" id="adminToggle"><div class="thumb"></div></div>
        </div>
        <div class="block-row">
            <input type="number" id="blockInput" placeholder="ID пользователя" min="1">
            <button id="blockBtn">⛔ Блок</button>
            <button class="green" id="unblockBtn">✅ Разблок</button>
        </div>
    </div>

    <div id="toast" class="toast">👋 Кликни на холст!</div>
</div>
<script>
(function() {
    const SIZE = 1000;
    const OWNER_ID = 1393765131;
    const COLORS = ['#e94560','#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#845ec2','#ff6f91','#00c9a7','#ff9671','#0081cf'];

    let pixels = new Array(SIZE * SIZE).fill(null);
    let selectedColor = '#e94560';
    let zoom = 1;
    let showGrid = false;
    let isMagnifier = false;
    let adminMode = false;
    let currentUser = null;
    let blockedUsers = new Set();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const palette = document.getElementById('palette');
    const toast = document.getElementById('toast');
    const zoomLabel = document.getElementById('zoomLabel');
    const profilePanel = document.getElementById('profilePanel');

    function initUser() {
        if (window.Telegram && Telegram.WebApp) {
            let u = Telegram.WebApp.initDataUnsafe?.user;
            if (u) {
                currentUser = { id: u.id, name: u.first_name || 'Игрок', photo: u.photo_url || '' };
                updateProfile();
                return;
            }
        }
        currentUser = { id: Math.floor(Math.random()*1000000)+1000000, name: 'Player', photo: '' };
        updateProfile();
    }

    function updateProfile() {
        if (!currentUser) return;
        document.getElementById('userName').textContent = currentUser.name;
        document.getElementById('userId').textContent = 'ID: ' + currentUser.id;
        if (currentUser.photo) {
            document.getElementById('avatar').innerHTML = '<img src="'+currentUser.photo+'">';
        } else {
            document.getElementById('avatar').textContent = '👤';
        }
        let stats = getStats(currentUser.id);
        document.getElementById('firstPixel').textContent = stats.first ? new Date(stats.first).toLocaleDateString() : '—';
        document.getElementById('lastPixel').textContent = stats.last ? new Date(stats.last).toLocaleDateString() : '—';
        document.getElementById('totalPixels').textContent = stats.total || 0;
        let blocked = blockedUsers.has(currentUser.id);
        let status = document.getElementById('userStatus');
        status.textContent = blocked ? '⛔ Заблокирован' : '✅ Активен';
        status.style.color = blocked ? '#e94560' : '#4caf50';
    }

    function getStats(id) {
        let data = JSON.parse(localStorage.getItem('pixelStats') || '{}');
        if (!data[id]) data[id] = { first: null, last: null, total: 0 };
        return data[id];
    }

    function saveStats(id, stats) {
        let data = JSON.parse(localStorage.getItem('pixelStats') || '{}');
        data[id] = stats;
        localStorage.setItem('pixelStats', JSON.stringify(data));
    }

    function loadBlocked() {
        try {
            let data = JSON.parse(localStorage.getItem('blockedUsers') || '[]');
            blockedUsers = new Set(data);
        } catch(e) { blockedUsers = new Set(); }
    }

    function saveBlocked() {
        localStorage.setItem('blockedUsers', JSON.stringify([...blockedUsers]));
    }

    function loadPixels() {
        try {
            let data = JSON.parse(localStorage.getItem('pixels') || '[]');
            for (let i = 0; i < data.length && i < pixels.length; i++) {
                if (data[i]) pixels[i] = data[i];
            }
        } catch(e) {}
    }

    function savePixels() {
        localStorage.setItem('pixels', JSON.stringify(pixels));
    }

    function render() {
        let rect = canvas.getBoundingClientRect();
        let displaySize = Math.min(rect.width, rect.height);
        canvas.style.width = displaySize + 'px';
        canvas.style.height = displaySize + 'px';
        canvas.width = SIZE;
        canvas.height = SIZE;

        ctx.clearRect(0, 0, SIZE, SIZE);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, SIZE, SIZE);

        let pixelSize = Math.max(1, Math.floor(1 / zoom));
        let startX = Math.floor((1 - 1/zoom) / 2 * SIZE);
        let startY = Math.floor((1 - 1/zoom) / 2 * SIZE);
        let endX = Math.floor((1 + 1/zoom) / 2 * SIZE);
        let endY = Math.floor((1 + 1/zoom) / 2 * SIZE);

        for (let y = startY; y < endY && y < SIZE; y += pixelSize) {
            for (let x = startX; x < endX && x < SIZE; x += pixelSize) {
                let idx = y * SIZE + x;
                if (pixels[idx]) {
                    ctx.fillStyle = pixels[idx].color;
                    ctx.fillRect(x, y, pixelSize, pixelSize);
                }
            }
        }

        if (showGrid) {
            ctx.strokeStyle = 'rgba(0,0,0,0.06)';
            ctx.lineWidth = 0.3;
            let gridStep = Math.max(1, Math.floor(50 / zoom));
            for (let i = startX; i <= endX; i += gridStep) {
                ctx.beginPath(); ctx.moveTo(i, startY); ctx.lineTo(i, endY); ctx.stroke();
            }
            for (let i = startY; i <= endY; i += gridStep) {
                ctx.beginPath(); ctx.moveTo(startX, i); ctx.lineTo(endX, i); ctx.stroke();
            }
        }

        zoomLabel.textContent = Math.round(zoom * 100) + '%';
    }

    function getCoords(clientX, clientY) {
        let rect = canvas.getBoundingClientRect();
        let x = Math.floor((clientX - rect.left) / rect.width * SIZE);
        let y = Math.floor((clientY - rect.top) / rect.height * SIZE);
        return { x, y };
    }

    let toastTimer;

    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    let lastClick = 0;
    const COOLDOWN = 2000;

    function handleClick(clientX, clientY) {
        if (!currentUser) { showToast('⚠️ Ошибка пользователя'); return; }

        let { x, y } = getCoords(clientX, clientY);
        if (x < 0 || x >= SIZE || y < 0 || y >= SIZE) { showToast('❌ Вне холста'); return; }

        let idx = y * SIZE + x;

        if (isMagnifier) {
            if (pixels[idx]) {
                let time = Math.floor((Date.now() - pixels[idx].time) / (1000*60*60*24));
                let days = time > 0 ? time + ' дн.' : 'сегодня';
                showToast('🎨 ' + (pixels[idx].name || 'anon') + ' (ID:' + pixels[idx].id + ') ' + days);
            } else {
                showToast('⬜ Пусто (' + x + ',' + y + ')');
            }
            return;
        }

        if (!selectedColor) { showToast('⚠️ Выбери цвет!'); return; }

        if (blockedUsers.has(currentUser.id) && currentUser.id !== OWNER_ID) {
            showToast('⛔ Ты заблокирован!');
            return;
        }

        if (adminMode && currentUser.id === OWNER_ID) {
            pixels[idx] = { color: selectedColor, id: currentUser.id, name: currentUser.name, time: Date.now() };
            render();
            showToast('👑 Админ (' + x + ',' + y + ')');
            savePixels();
            return;
        }

        let now = Date.now();
        if (now - lastClick < COOLDOWN) {
            showToast('⏳ Подожди ' + Math.ceil((COOLDOWN - (now - lastClick))/1000) + 'с');
            return;
        }

        if (pixels[idx]) {
            showToast('❌ Занято (' + (pixels[idx].name || 'anon') + ')');
            return;
        }

        pixels[idx] = { color: selectedColor, id: currentUser.id, name: currentUser.name, time: Date.now() };
        lastClick = now;
        render();

        let stats = getStats(currentUser.id);
        if (!stats.first) stats.first = Date.now();
        stats.last = Date.now();
        stats.total = (stats.total || 0) + 1;
        saveStats(currentUser.id, stats);

        showToast('✅ Пиксель! (' + x + ',' + y + ')');
        updateProfile();
        savePixels();
    }

    function renderPalette() {
        palette.innerHTML = '';
        COLORS.forEach(c => {
            let btn = document.createElement('div');
            btn.className = 'color-btn';
            btn.style.background = c;
            if (c === selectedColor) btn.classList.add('selected');
            btn.addEventListener('click', () => {
                selectedColor = c;
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                showToast('🎨 Цвет выбран');
            });
            palette.appendChild(btn);
        });
    }

    function setupToggle(el, callback) {
        el.addEventListener('click', () => {
            let active = el.classList.toggle('active');
            callback(active);
        });
    }

    function setup() {
        canvas.addEventListener('click', (e) => handleClick(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            let touch = e.touches[0];
            if (touch) handleClick(touch.clientX, touch.clientY);
        }, { passive: false });

        document.getElementById('gridBtn').addEventListener('click', () => {
            showGrid = !showGrid;
            document.getElementById('gridBtn').classList.toggle('active');
            render();
        });

        document.getElementById('zoomIn').addEventListener('click', () => {
            zoom = Math.min(20, zoom * 1.3);
            render();
        });

        document.getElementById('zoomOut').addEventListener('click', () => {
            zoom = Math.max(0.5, zoom / 1.3);
            render();
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            zoom = 1;
            render();
        });

        document.getElementById('magnifierBtn').addEventListener('click', () => {
            isMagnifier = !isMagnifier;
            document.getElementById('magnifierBtn').classList.toggle('active');
            showToast(isMagnifier ? '🔍 Лупа включена' : '🔍 Лупа выключена');
        });

        document.getElementById('supportBtn').addEventListener('click', () => {
            window.open('https://t.me/empty0_0channel/3', '_blank');
        });

        document.getElementById('tabBattle').addEventListener('click', () => {
            document.getElementById('tabBattle').classList.add('active');
            document.getElementById('tabProfile').classList.remove('active');
            profilePanel.classList.remove('show');
        });

        document.getElementById('tabProfile').addEventListener('click', () => {
            document.getElementById('tabProfile').classList.add('active');
            document.getElementById('tabBattle').classList.remove('active');
            profilePanel.classList.add('show');
            updateProfile();
        });

        setupToggle(document.getElementById('adminToggle'), (active) => {
            if (currentUser && currentUser.id === OWNER_ID) {
                adminMode = active;
                showToast(active ? '👑 Админ включён' : '👑 Админ выключен');
            } else {
                document.getElementById('adminToggle').classList.remove('active');
                showToast('❌ Только для владельца');
            }
        });

        document.getElementById('blockBtn').addEventListener('click', () => {
            if (!currentUser || currentUser.id !== OWNER_ID) { showToast('❌ Только для владельца'); return; }
            let id = parseInt(document.getElementById('blockInput').value);
            if (!id || id <= 0) { showToast('❌ Введи ID'); return; }
            blockedUsers.add(id);
            saveBlocked();
            showToast('⛔ Пользователь ' + id + ' заблокирован');
            updateProfile();
            document.getElementById('blockInput').value = '';
        });

        document.getElementById('unblockBtn').addEventListener('click', () => {
            if (!currentUser || currentUser.id !== OWNER_ID) { showToast('❌ Только для владельца'); return; }
            let id = parseInt(document.getElementById('blockInput').value);
            if (!id || id <= 0) { showToast('❌ Введи ID'); return; }
            blockedUsers.delete(id);
            saveBlocked();
            showToast('✅ Пользователь ' + id + ' разблокирован');
            updateProfile();
            document.getElementById('blockInput').value = '';
        });

        loadBlocked();
        loadPixels();
        initUser();
        renderPalette();
        render();

        setInterval(savePixels, 5000);

        showToast('👋 Кликни на холст!');
    }

    document.addEventListener('DOMContentLoaded', setup);
})();
</script>
</body>
    </html>
